# Override for a host that already runs one PostgreSQL for several stacks. Layered on top of
# compose.portainer.yml, never used alone:
#
#   docker compose -f compose.portainer.yml -f compose.shared-db.yml up -d
#
# In Portainer, compose.portainer.yml is the Git stack's compose path and this file its additional
# path, so a pull-and-redeploy keeps following the repository.
#
# The shared server must already hold the POSTGRES_DB database owned by POSTGRES_USER with
# POSTGRES_PASSWORD, and must sit on the external network SHARED_DB_NETWORK.
x-shared-db-env: &shared-db-env
  DATABASE_URL: postgresql://${POSTGRES_USER:-session_tracker}:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}@${SHARED_DB_HOST:-shared-postgres}:5432/${POSTGRES_DB:-session_tracker}?schema=public

services:
  # Kept out of every ordinary `up` rather than deleted, which an override cannot do.
  db:
    profiles: [bundled-postgres]

  server:
    depends_on: !reset {}
    environment: *shared-db-env
    networks: [default, shared-db]

  bot:
    depends_on: !override
      server:
        condition: service_healthy
    environment: *shared-db-env
    networks: [default, shared-db]

networks:
  shared-db:
    name: ${SHARED_DB_NETWORK:-shared-db}
    external: true
