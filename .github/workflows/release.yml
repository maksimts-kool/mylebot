name: Release

# Run from the Actions tab ("Run workflow"), or: gh workflow run release.yml -f bump=patch
on:
  workflow_dispatch:
    inputs:
      bump:
        description: "patch 1.2.3 → 1.2.4 · minor → 1.3.0 · major → 2.0.0"
        type: choice
        options: [patch, minor, major]
        default: patch

permissions:
  contents: write

# Two releases at once would both try to claim the same version.
concurrency: release

jobs:
  release:
    runs-on: ubuntu-latest
    if: github.ref_name == github.event.repository.default_branch

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - run: npm ci
      - run: npm run prisma:generate
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

      - name: Bump version and changelog
        id: prepare
        env:
          BUMP: ${{ inputs.bump }}
          NOTES_FILE: ${{ runner.temp }}/notes.md
        run: npx tsx scripts/release.ts "$BUMP" "$NOTES_FILE" >> "$GITHUB_OUTPUT"

      - name: Commit and tag
        env:
          TAG: v${{ steps.prepare.outputs.version }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -am "chore(release): $TAG"
          git tag -a "$TAG" -m "$TAG"
          git push origin HEAD "$TAG"

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: v${{ steps.prepare.outputs.version }}
        run: gh release create "$TAG" --title "$TAG" --notes-file "${{ runner.temp }}/notes.md"
