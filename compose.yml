# Local stack with its own PostgreSQL. For Portainer on a host with a shared
# PostgreSQL, use compose.portainer.yml instead.
x-app: &app
  build: .
  restart: unless-stopped
  env_file:
    - path: .env
      required: false
  environment: &app-env
    API_HOST: 0.0.0.0
    INTERNAL_SECRET: ${INTERNAL_SECRET:?set INTERNAL_SECRET}
    # Containers have no terminal, so colour is opt-in rather than detected.
    LOG_COLOR: ${LOG_COLOR:-always}
    LOG_LEVEL: ${LOG_LEVEL:-info}

x-healthcheck: &healthcheck
  test: [ "CMD", "node", "-e", "fetch('http://127.0.0.1:3000/ready').then(r=>{if(!r.ok){console.error('readiness check failed: status='+r.status);process.exit(1)}}).catch(()=>{console.error('readiness check failed: unavailable');process.exit(1)})" ]
  interval: 15s
  timeout: 5s
  retries: 5
  start_period: 20s

services:
  # Owns the database and every integration: the Roblox ingestion API, command
  # logs, the Taiga webhook, the portal endpoints, Bloxlink, and every scheduled
  # job. The only published port, and the only container that applies
  # migrations. It never talks to Discord itself; it asks the bot.
  server:
    <<: *app
    environment:
      <<: *app-env
      APP_ROLE: server
      DATABASE_URL: postgresql://${POSTGRES_USER:-session_tracker}:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-session_tracker}?schema=public
      BOT_INTERNAL_URL: http://bot:3001
      # Discord is the bot's alone.
      DISCORD_TOKEN: ""
    ports:
      - "${APP_BIND_IP:-127.0.0.1}:${APP_PORT:-3000}:3000"
    depends_on:
      db:
        condition: service_healthy
    healthcheck: *healthcheck

  # Holds the Discord gateway and nothing else: slash commands, buttons, and the
  # messages the server asks it to post. No database connection and no
  # published port. The two call each other on port 3001 over this network;
  # never publish that port.
  bot:
    <<: *app
    environment:
      <<: *app-env
      APP_ROLE: bot
      SERVER_INTERNAL_URL: http://server:3001
      # Whatever .env holds for the server half stays out of this container.
      DATABASE_URL: ""
      ROBLOX_INGESTION_SECRET: ""
      BLOXLINK_API_KEY: ""
      SITE_NOTIFY_SECRET: ""
      TAIGA_PASSWORD: ""
      TAIGA_WEBHOOK_SECRET: ""
    depends_on:
      # The bot asks the server which features run before it logs in.
      server:
        condition: service_healthy
    healthcheck: *healthcheck

  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-session_tracker}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-session_tracker}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-session_tracker} -d ${POSTGRES_DB:-session_tracker}" ]
      interval: 5s
      timeout: 5s
      retries: 12
volumes:
  postgres_data:
