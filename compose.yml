x-app: &app
  build: .
  restart: unless-stopped
  env_file:
    - path: .env
      required: false
  environment: &app-env
    DATABASE_URL: postgresql://${POSTGRES_USER:-session_tracker}:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-session_tracker}?schema=public
    API_HOST: 0.0.0.0
    INTERNAL_SECRET: ${INTERNAL_SECRET:?set INTERNAL_SECRET}
    # Containers have no terminal, so colour is opt-in rather than detected.
    LOG_COLOR: ${LOG_COLOR:-always}
    LOG_LEVEL: ${LOG_LEVEL:-info}

x-healthcheck: &healthcheck
  test: [ "CMD", "node", "-e", "fetch('http://127.0.0.1:3000/ready').then(r=>{if(!r.ok){console.error('readiness check failed: status='+r.status);process.exit(1)}}).catch(()=>{console.error('readiness check failed: unavailable');process.exit(1)})" ]
  interval: 15s
  timeout: 5s
  retries: 5
  start_period: 20s

services:
  # The only published port. Answers the Roblox ingestion API itself and hands
  # the Discord-backed endpoints — /internal/* and the Taiga webhook — to the
  # bot over this network, so every external URL stays what it always was.
  # It also owns the schema: migrations run here and nowhere else.
  server:
    <<: *app
    environment:
      <<: *app-env
      APP_ROLE: server
      BOT_INTERNAL_URL: http://bot:3000
    ports:
      - "${APP_BIND_IP:-127.0.0.1}:${APP_PORT:-3000}:3000"
    depends_on:
      db:
        condition: service_healthy
    healthcheck: *healthcheck

  # Holds the Discord gateway: slash commands, session messages, the scheduled
  # jobs. No published port — the server reaches it over the compose network.
  bot:
    <<: *app
    environment:
      <<: *app-env
      APP_ROLE: bot
    depends_on:
      db:
        condition: service_healthy
      # The server applies the migrations, so the bot waits for a schema to use.
      server:
        condition: service_healthy
    healthcheck: *healthcheck

  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-session_tracker}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-session_tracker}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-session_tracker} -d ${POSTGRES_DB:-session_tracker}" ]
      interval: 5s
      timeout: 5s
      retries: 12
volumes:
  postgres_data:
