# Portainer stack for a host that already runs one PostgreSQL for several
# stacks. Deploy it as a Git stack from this repository, with this file as the
# compose path, so a pull-and-redeploy keeps following the repository.
#
# The shared server must already hold the POSTGRES_DB database owned by
# POSTGRES_USER with POSTGRES_PASSWORD, and must sit on the external network
# SHARED_DB_NETWORK. Only the server container joins that network: the bot
# never connects to the database.
#
# For a stack with its own PostgreSQL, use compose.yml.
x-common-env: &common-env
  API_HOST: 0.0.0.0
  API_PORT: 3000
  INTERNAL_SECRET: ${INTERNAL_SECRET:?set INTERNAL_SECRET}
  LOG_LEVEL: ${LOG_LEVEL:-info}
  # Containers have no terminal, so colour is opt-in rather than detected.
  LOG_COLOR: ${LOG_COLOR:-always}
  LOG_FORMAT: ${LOG_FORMAT:-pretty}
  REPORT_TIMEZONE: ${REPORT_TIMEZONE:-Europe/Tallinn}
  TRUST_PROXY: ${TRUST_PROXY:-loopback}
  # Discord IDs, not secrets. The server keys Bloxlink lookups and verification
  # deadlines by the guild; the bot posts and kicks there.
  DISCORD_GUILD_ID: ${DISCORD_GUILD_ID:?set DISCORD_GUILD_ID}
  VERIFICATION_CHANNEL_ID: ${VERIFICATION_CHANNEL_ID:-}
  VERIFICATION_UNVERIFIED_ROLE_ID: ${VERIFICATION_UNVERIFIED_ROLE_ID:-}

x-healthcheck: &healthcheck
  test: [ "CMD", "node", "-e", "fetch('http://127.0.0.1:3000/ready').then(r=>{if(!r.ok){console.error('readiness check failed: status='+r.status);process.exit(1)}}).catch(()=>{console.error('readiness check failed: unavailable');process.exit(1)})" ]
  interval: 15s
  timeout: 5s
  retries: 5
  start_period: 30s

services:
  # Owns the database and every integration — Roblox, command logs, Taiga, the
  # portal, Bloxlink — and runs every scheduled job. The only published port,
  # and the only container that applies migrations.
  server:
    build:
      context: .
    restart: unless-stopped
    environment:
      <<: *common-env
      APP_ROLE: server
      BOT_INTERNAL_URL: http://bot:3001
      DATABASE_URL: postgresql://${POSTGRES_USER:-session_tracker}:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}@${SHARED_DB_HOST:-shared-postgres}:5432/${POSTGRES_DB:-session_tracker}?schema=public
      SITE_NOTIFY_SECRET: ${SITE_NOTIFY_SECRET:?set SITE_NOTIFY_SECRET}
      BLOXLINK_API_KEY: ${BLOXLINK_API_KEY:-}
      ROBLOX_INGESTION_SECRET: ${ROBLOX_INGESTION_SECRET:?set ROBLOX_INGESTION_SECRET}
      ROBLOX_UNIVERSE_ID: ${ROBLOX_UNIVERSE_ID:?set ROBLOX_UNIVERSE_ID}
      ROBLOX_GROUP_ID: ${ROBLOX_GROUP_ID:?set ROBLOX_GROUP_ID}
      ROBLOX_ALLOWED_PLACE_IDS: ${ROBLOX_ALLOWED_PLACE_IDS:?set ROBLOX_ALLOWED_PLACE_IDS}
      ROBLOX_MIN_RANK: ${ROBLOX_MIN_RANK:-1}
      ROBLOX_MAX_RANK: ${ROBLOX_MAX_RANK:-255}
      TAIGA_BASE_URL: ${TAIGA_BASE_URL:-https://api.taiga.io}
      TAIGA_WEB_URL: ${TAIGA_WEB_URL:-https://tree.taiga.io}
      TAIGA_USERNAME: ${TAIGA_USERNAME:-}
      TAIGA_PASSWORD: ${TAIGA_PASSWORD:-}
      TAIGA_PROJECT_SLUG: ${TAIGA_PROJECT_SLUG:-}
      TAIGA_WEBHOOK_SECRET: ${TAIGA_WEBHOOK_SECRET:-}
      TAIGA_RECONCILE_SECONDS: ${TAIGA_RECONCILE_SECONDS:-600}
    ports:
      - "${APP_BIND_IP:-127.0.0.1}:${APP_PORT:-3000}:3000"
    networks: [default, shared-db]
    healthcheck: *healthcheck

  # Holds the Discord gateway and nothing else. No database, no published
  # port: the two call each other on port 3001 over the stack's own network.
  # Never publish that port.
  bot:
    build:
      context: .
    restart: unless-stopped
    environment:
      <<: *common-env
      APP_ROLE: bot
      SERVER_INTERNAL_URL: http://server:3001
      DISCORD_TOKEN: ${DISCORD_TOKEN:?set DISCORD_TOKEN}
      DISCORD_APPLICATION_ID: ${DISCORD_APPLICATION_ID:?set DISCORD_APPLICATION_ID}
    depends_on:
      # The bot asks the server which features run before it logs in.
      server:
        condition: service_healthy
    networks: [default]
    healthcheck: *healthcheck

networks:
  shared-db:
    name: ${SHARED_DB_NETWORK:-shared-db}
    external: true
